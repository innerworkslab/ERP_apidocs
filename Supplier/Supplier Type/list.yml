info:
  name: list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/supplier-types"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/supplier-types"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.12
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Mon, 04 May 2026 03:53:00 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: ""
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Supplier type list"
            },
            "data": [
              {
                "id": 2,
                "name": "Wholesale",
                "created_at": "2026-05-04T03:52:53.000000Z",
                "updated_at": "2026-05-04T03:52:53.000000Z"
              },
              {
                "id": 1,
                "name": "Retail",
                "created_at": "2026-05-04T03:52:10.000000Z",
