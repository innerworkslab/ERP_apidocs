info:
  name: list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/branches/all?page=1&per_page=10&status=active"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
    - name: search
      value: md
      type: query
      disabled: true
    - name: status
      value: active
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

