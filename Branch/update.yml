info:
  name: update
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/v1/branches/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "prefix": "YGN",
        "name": "Yangon Branch",
        "address": "street 1",
        "latitude": "12.977399", // optional
        "longitude": "14.977399", // optional
        "mobile_phones": [
          "+959111111111",
          "+959222222222"
      ], // at least one phone
        "email": "email.juuuu@juuuu.com", // optional
        "website": "https://juuuwebsite.com", // optional
        "facebook": "juujuuu page link", // optional
        "state_id": 1,
        "city_id": 1,
        "status": "active" // or inactive
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
