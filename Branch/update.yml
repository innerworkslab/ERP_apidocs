info:
  name: update
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/v1/branches/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "prefix": "MDY Update",
        "name": "Mandalay Branch",
        "location": "Mandalay, 77*65",
        "status": "inactive" // or inactive
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/branches/:id"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
      params:
        - name: id
          value: "1"
          type: path
      body:
        type: json
        data: |-
          {
            "prefix": "MDY Update",
            "name": "Mandalay Branch",
            "location": "Mandalay, 77*65",
            "status": "inactive" // or inactive
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.30
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Wed, 18 Mar 2026 04:01:05 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Branch is updated successfully"
            },
            "data": {
              "id": 1,
              "prefix": "MDY Update",
              "name": "Mandalay Branch",
              "location": "Mandalay, 77*65",
              "status": "inactive",
              "created_by": 1,
              "updated_by": null,
              "created_at": "2026-03-18 03:51:33",
              "updated_at": "2026-03-18 04:01:05"
            }
          }
