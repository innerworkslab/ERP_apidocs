info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/branches"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "prefix": "YGN",
        "name": "Yangon Branch",
        "location": "Yangon, 130st",
        "status": "active" // or inactive
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/branches"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "prefix": "MDY",
            "name": "Mandalay Branch",
            "location": "Mandalay, 77*65",
            "status": "active" // or inactive
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.30
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Wed, 18 Mar 2026 03:51:33 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Branch is created successfully"
            },
            "data": {
              "prefix": "MDY",
              "name": "Mandalay Branch",
              "location": "Mandalay, 77*65",
              "status": "active",
              "created_by": 1,
              "updated_at": "2026-03-18 03:51:33",
              "created_at": "2026-03-18 03:51:33",
              "id": 1
            }
          }
