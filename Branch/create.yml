info:
  name: create
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/v1/branches"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "prefix": "MDY",
        "name": "Mandalay Branch",
        "address": "street 1",
        "latitude": "12.977399", // optional
        "longitude": "14.977399", // optional
        "mobile_phones": [
          "+9123456789",
          "+9987654321"
      ], // at least one phone
        "email": "email.buuu@buuu.com", // optional
        "website": "https://buuuwebsite.com", // optional
        "facebook": "facebook page link", // optional
        "state_id": 3,
        "city_id": 4,
        "status": "active" // or inactive
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
