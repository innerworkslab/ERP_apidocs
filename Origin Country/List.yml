info:
  name: List
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/v1/origin-countries"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/origin-countries"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.12
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Tue, 31 Mar 2026 03:48:05 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: ""
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Origin country lists"
            },
            "data": [
              {
                "id": 1,
                "name": "Myanmar",
                "created_at": "2026-03-31T03:47:55.000000Z",
                "updated_at": "2026-03-31T03:47:55.000000Z"
              }
            ],
            "meta": {
              "total": 1,
              "per_page": 20,
              "current_page": 1,
              "total_pages": 1
            }
          }
