info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/v1/origin-countries"
  body:
    type: json
    data: |-
      {
        "name": "Thailand",
        "status" : "active"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/origin-countries"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Thailand",
            "status" : "active"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.12
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Mon, 04 May 2026 08:52:14 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: ""
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Origin country is created successfully"
            },
            "data": {
              "name": "Thailand",
              "updated_at": "2026-05-04T08:52:14.000000Z",
              "created_at": "2026-05-04T08:52:14.000000Z",
              "id": 2
            }
          }
