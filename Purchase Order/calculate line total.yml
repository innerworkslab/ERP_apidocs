info:
  name: calculate line total
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/v1/purchase-orders/calculate-line-total"
  body:
    type: json
    data: |-
      {
        "quantity": 5,
        "unit_price": 50000,
        "discount_amount": 10000,
        "tax_amount": 5000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/purchase-orders/calculate-line-total"
      method: POST
      body:
        type: json
        data: |-
          {
            "quantity": 5,
            "unit_price": 50000,
            "discount_amount": 10000,
            "tax_amount": 5000
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.12
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Wed, 20 May 2026 07:53:21 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: ""
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Purchase order line total calculated successfully"
            },
            "data": {
              "quantity": 5,
              "unit_price": 50000,
              "discount_amount": 10000,
              "tax_amount": 5000,
              "gross_amount": 250000,
              "line_total": 245000
            }
          }
