info:
  name: logout
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/users/auth/logout"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
