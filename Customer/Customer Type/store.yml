info:
  name: store
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/customer-types"
  body:
    type: json
    data: |
      {
        "name": "Wholesale"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/customer-types"
      method: POST
      body:
        type: json
        data: |
          {
            "name": "Wholesale"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.12
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Mon, 04 May 2026 04:12:16 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: ""
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Customer type created successfully"
            },
            "data": {
              "name": "Wholesale",
              "updated_at": "2026-05-04T04:12:16.000000Z",
              "created_at": "2026-05-04T04:12:16.000000Z",
              "id": 2
            }
          }
