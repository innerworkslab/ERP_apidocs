info:
  name: assign roles to feature
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/features/assign-roles"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "feature_id": 2,
        "role_ids": [2]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/features/assign-roles"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "feature_id": 1,
            "role_ids": [1,2]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.30
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Thu, 19 Mar 2026 06:58:54 GMT
        - name: content-type
          value: application/json
        - name: vary
          value: Origin
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Assigned Roles successfully"
            },
            "data": []
          }
