info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/collections"
  body:
    type: json
    data: |-
      {
        "name": "Summer Collection 2026",
        "purchase_price": 12000,
        "purchase_currency_id": 1,
        "purchase_tax_id": 1,
        "purchase_uom_id": 1,
        "sale_price": 15000,
        "sale_currency_id": 1,
        "sale_tax_id": 1,
        "sale_uom_id": 1,
        "status": "active"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
