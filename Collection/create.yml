            "name": "Summer Collection 2026",
            "purchase_price": 12000,
            "purchase_currency_id": 1,
            "purchase_tax_id": 1,
            "purchase_uom_id": 1,
            "sale_price": 15000,
            "sale_currency_id": 1,
            "sale_tax_id": 1,
            "sale_uom_id": 1,
            "status": "active"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.12
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Fri, 03 Apr 2026 10:06:35 GMT
