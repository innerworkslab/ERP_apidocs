info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/uom-conversions"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "conversions_name": "Kg to Gram",
        "base_unit_id": 1,
        "conversion_unit_id": 2,
        "conversion_rate": 1000,
        "status": "active" // inactive
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
