    request:
      url: "{{baseUrl}}/v1/uom-conversions"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "conversions_name": "Kg to Gram",
            "base_unit_id": 1,
            "conversion_unit_id": 2,
            "conversion_rate": 1000,
            "status": "active" // inactive
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.12
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Thu, 18 Jun 2026 03:21:29 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: ""
      body:
