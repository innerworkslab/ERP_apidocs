info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/categories"
  body:
    type: json
    data: |+
      {
        "name": "Electronics",
        "description": "Electronic devices and gadgets",
        "status": "active"
      }

  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/categories"
      method: POST
      body:
        type: json
        data: |+
          {
            "name": "Electronics",
            "description": "Electronic devices and gadgets",
            "status": "active"
          }

    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.12
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Thu, 26 Mar 2026 10:41:30 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: ""
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Category is created successfully"
            },
            "data": {
              "name": "Electronics",
              "description": "Electronic devices and gadgets",
              "status": "active",
              "created_by": 1,
              "updated_at": "2026-03-26T10:41:30.000000Z",
              "created_at": "2026-03-26T10:41:30.000000Z",
              "id": 1
            }
          }
