info:
  name: update
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/v1/unit-of-measurements/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "2"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Meter",
        "code": "m",
        "status": "inactive" // or inactive
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

