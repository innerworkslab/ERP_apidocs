info:
  name: product-lot-list
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/v1/stock-balances/product/:productId/lots"
  params:
    - name: productId
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

