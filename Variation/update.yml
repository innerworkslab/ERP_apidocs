info:
  name: update
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/v1/variations/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Color",
        "value_data_type": "String",
        "status": "active" // or inactive
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

