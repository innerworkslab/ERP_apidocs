info:
  name: update
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/v1/variations/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Color Update",
        "value_data_type": "String update",
        "status": "inactive", // or inactive
        "product_category_ids": [2,3]
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
