info:
  name: list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/price-groups?status=inactive"
  params:
    - name: search
      value: Retail
      type: query
      disabled: true
    - name: customer_type_id
      value: "1"
      type: query
      disabled: true
    - name: branch_id
      value: "3"
      type: query
      disabled: true
    - name: is_active
      value: "0"
      type: query
      disabled: true
    - name: status
      value: inactive
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

