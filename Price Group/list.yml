          value: Retail
          type: query
          disabled: true
        - name: customer_type_id
          value: "1"
          type: query
          disabled: true
        - name: branch_id
          value: "3"
          type: query
          disabled: true
        - name: is_active
          value: "0"
          type: query
          disabled: true
        - name: status
          value: inactive
          type: query
    response:
      status: 200
      statusText: OK
