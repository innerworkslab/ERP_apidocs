info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/price-groups"
  body:
    type: json
    data: |-
      {
        "name": "Retail Standard",
        "customer_type_id": 1,
        "branch_id": 1,
        "profit_margin_type": "percentage",
        "profit_margin_value": 15
      }

      // {
