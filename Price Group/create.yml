      //   "customer_type_id": 2,
      //   "branch_id": 1,
      //   "profit_margin_type": "fixed",
      //   "profit_margin_value": 5000
      // }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

