info:
  name: update
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/v1/cashbooks/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "branch_id": 1,
        "currency_id": 1,
        "name": "KBZ Main Cash update",
        "type": "cash",  //'cash','bank','mobile_wallet','petty_cash',
        "status": "inactive",
        "remark": "Main office daily cashbook"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
