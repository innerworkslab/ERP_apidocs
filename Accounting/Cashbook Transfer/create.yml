info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/v1/cashbook-transfers"
  body:
    type: json
    data: |-
      {
        "source_cashbook_id": 1,
        "destination_cashbook_id": 2,
        "amount": 75000,
        "currency_id": 1,
        "remark": "Transfer to second branch"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

