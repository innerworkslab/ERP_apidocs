info:
  name: create
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/v1/cashbook-transactions"
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: multipart-form
    data:
      - name: cashbook_id
        type: text
        value: "1"
      - name: source_account_id
        type: text
        value: "23"
      - name: category
        type: text
        value: expense
      - name: currency_id
        type: file
        value: []
      - name: attachments[0]
        type: text
        value: ""
        disabled: true
      - name: attachments[1]
        type: text
        value: ""
        disabled: true
      - name: amount
        type: text
        value: "20000"
      - name: remark
        type: text
        value: Office supplies
      - name: description
        type: text
        value: Bought printer ink
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/cashbook-transactions"
      method: POST
      headers:
        - name: Content-Type
          value: multipart/form-data
      body:
        type: multipart-form
        data:
          - name: cashbook_id
            type: text
            value: "1"
          - name: source_account_id
            type: text
            value: "12"
          - name: category
            type: text
            value: expense // income
          - name: currency_id
            type: text
            value: "1"
          - name: attachments[0]
            type: text
            value: ""
            disabled: true
          - name: attachments[1]
            type: text
            value: ""
            disabled: true
          - name: amount
            type: text
            value: "500000"
          - name: remark
            type: text
            value: Test
          - name: description
            type: text
            value: Transaction test
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.12
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Sun, 21 Jun 2026 03:42:46 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: ""
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Cashbook Transaction is created successfully"
            },
            "data": {
              "cashbook_id": "1",
              "source_account_id": "12",
              "currency_id": "1",
              "category": "income",
              "amount": "500000.00000000",
              "remark": "Test",
              "description": "Transaction test",
              "created_by": 1,
              "destination_account_id": 113,
