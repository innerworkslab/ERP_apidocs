info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/brands"
  body:
    type: json
    data: |-
      {
      "name": "Nike",
      "description": "Premium devices",
      "status": "active"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/brands"
      method: POST
      body:
        type: json
        data: |-
          {
          "name": "Nike",
          "description": "Premium devices",
          "status": "active"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.12
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Thu, 26 Mar 2026 09:56:38 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: ""
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Brand is created successfully"
            },
            "data": {
              "name": "Nike",
              "description": "Premium devices",
              "status": "active",
              "created_by": 1,
              "updated_at": "2026-03-26T09:56:38.000000Z",
              "created_at": "2026-03-26T09:56:38.000000Z",
              "id": 3
            }
          }
