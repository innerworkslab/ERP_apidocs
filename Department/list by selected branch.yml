info:
  name: list by selected branch
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/v1/departments/by-branch?page=1&per_page=10&branch_id=2&status=active"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
    - name: search
      value: IT
      type: query
      disabled: true
    - name: branch_id
      value: "2"
      type: query
    - name: status
      value: active
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
