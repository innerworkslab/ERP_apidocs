info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/departments"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "code": "ITD",
        "name": "IT Department",
        "branch_id": 1,
        "status": "inactive", // or active,
        "description": "For software development" // optional
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/departments"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "ITD",
            "name": "IT Department",
            "branch_id": 1,
            "status": "inactive" // or active
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.30
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Wed, 18 Mar 2026 04:55:54 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Department is created successfully"
            },
            "data": {
              "code": "ITD",
              "name": "IT Department",
              "branch_id": 1,
              "status": "inactive",
              "updated_at": "2026-03-18 04:55:54",
              "created_at": "2026-03-18 04:55:54",
              "id": 1
            }
          }
