info:
  name: confirm
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/v1/opening-stocks/:id/confirm"
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/opening-stocks/:id/confirm"
      method: PATCH
      params:
        - name: id
          value: "1"
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.12
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Fri, 03 Apr 2026 16:56:09 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: ""
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "error",
              "message": "Opening stock already confirmed"
            },
            "data": []
          }
