info:
  name: update
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/v1/roles/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "3"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Manager",
        "parent_role_id": 1, // optional
        "status": "active", // or inactive
        "branch_id": 2,
        "department_id": 1 // fetch departments of selected branch
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

