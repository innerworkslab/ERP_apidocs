info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/roles"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name":"staff",
        "parent_role_id": 1, // optional
        "status": "active", // or inactive
        "branch_id": 1,
        "department_id": 1 // fetch departments of selected branch
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/v1/roles"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "Manager",
            "parent_role_id": 1, // optional
            "status": "active", // or inactive
            "branch_id": 1,
            "department_id": 1
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.30
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Wed, 18 Mar 2026 09:11:49 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "response": {
              "status": "success",
              "message": "Role is created successfully"
            },
            "data": {
              "name": "Manager",
              "status": "active",
              "parent_role_id": 1,
              "branch_id": 1,
              "department_id": 1,
              "created_by": 1,
              "updated_at": "2026-03-18 09:11:49",
              "created_at": "2026-03-18 09:11:49",
              "id": 2
            }
          }
